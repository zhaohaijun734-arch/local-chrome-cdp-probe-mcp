[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-chrome-cdp-probe-mcp"
version = "1.0.0"
description = "MCP server: real-browser measurement and screenshots via local Chrome DevTools Protocol, zero npm deps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mcp>=1.8"]

[project.scripts]
local-chrome-cdp-probe-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
